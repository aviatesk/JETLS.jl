#:schema ./schemas/config-toml.schema.json

# Treat all other diagnostics as warnings (for early detection via jetls check),
# except for those whose code contains "error", which keep their default severity
[[diagnostic.patterns]]
pattern = "^(?!.*error)"
match_by = "code"
match_type = "regex"
severity = "warn"
path = "src/**/*.jl"
[[diagnostic.patterns]]
pattern = "^(?!.*error)"
match_by = "code"
match_type = "regex"
severity = "warn"
path = "*/src/**/*.jl"

[[diagnostic.patterns]]
pattern = "lowering/inactive-code"
match_by = "code"
match_type = "literal" # Outrank code-regex catch-all diagnostic rules
severity = "hint"

# TODO [JETLS]
# `JETLSTestModule` is a pseudo lowering context only used as `analysis_overrides.module_name` for our test files; it is never reachable from JETLS itself, so diagnositcs against it are noise.
[[diagnostic.patterns]]
pattern = ".*"
match_by = "message"
match_type = "regex"
severity = "off"
path = "JETLSCore/src/utils/JETLSTestModule.jl"

# TODO [JETLS]
# When Revise updates the `Server` type graph, analyzing `run_serve` in the latest world
# sees an impossible assignment from latest `Server(endpoint)` to the old typed global.
[[diagnostic.patterns]]
pattern = "no matching method found `convert.*@world.JETLSCore[.]Server.*::JETLSCore[.]Server"
match_by = "message"
match_type = "regex"
severity = "off"
path = "JETLSCore/src/app/cli-serve.jl"

# Markdown elements hold content of any kind, e.g. strings, elements, and interpolated
# values, in `Vector{Any}` or untyped fields, `MD.meta` holds metadata of any kind, and
# `Config` holds parser functions. `MarkdownSource` maps the elements and their content
# vectors to source locations with `IdDict{Any}`s.
[[diagnostic.patterns]]
pattern = "toplevel/abstract-field"
match_by = "code"
match_type = "literal"
severity = "hint"
path = "MarkdownSource/src/**/*.jl"

# TODO [JETLS]
# Names used only in functions wrapped as `@trigger 'c' -> function ... end` are
# reported as unused: occurrence analysis strips the macrocall, and `'c' -> ...`
# fails to lower on its own.
[[diagnostic.patterns]]
pattern = "Unused import `(record_link!|substream|wrappedstream)`"
match_by = "message"
match_type = "regex"
severity = "off"
path = "MarkdownSource/src/MarkdownSource.jl"

# TOML tables hold values of any TOML type in `Dict{String,Any}`, as `TOML.parse` returns
# them. The parser forked from `Base.TOML` tracks the tables it builds by identity in
# `IdSet`s, and `Document` holds the parsed tables as they are.
[[diagnostic.patterns]]
pattern = "toplevel/abstract-field"
match_by = "code"
match_type = "literal"
severity = "hint"
path = "TOMLSource/src/**/*.jl"

# Fixture files that TestRunner's tests run with `runtest`. They intentionally contain
# failing tests, exceptions, and syntax errors, so silence their diagnostics, except for
# `toplevel/analysis-skipped` that shows they are excluded from full analysis below.
[[diagnostic.patterns]]
pattern = "^(?!toplevel/analysis-skipped$).*"
match_by = "code"
match_type = "regex"
severity = "off"
path = "TestRunner/test/testfile*.jl"
[[diagnostic.patterns]]
pattern = "^(?!toplevel/analysis-skipped$).*"
match_by = "code"
match_type = "regex"
severity = "off"
path = "TestRunner/test/_testfile*.jl"

[initialization_options]
reuse_native_inference = true

[[initialization_options.analysis_overrides]]
module_name = "JETLSCore"
path = "JETLSCore/src/**/*.jl"
full_analysis = true
[[initialization_options.analysis_overrides]]
path = "JETLSCore/test/**/*.jl"
module_name = "JETLSTestModule"

[[initialization_options.analysis_overrides]]
module_name = "LSP"
path = "LSP/src/**/*.jl"
full_analysis = true

[[initialization_options.analysis_overrides]]
module_name = "TestRunner"
path = "TestRunner/src/**/*.jl"
full_analysis = true
[[initialization_options.analysis_overrides]]
path = "TestRunner/test/testfile*.jl"
full_analysis = false
[[initialization_options.analysis_overrides]]
path = "TestRunner/test/_testfile*.jl"
full_analysis = false

[[initialization_options.analysis_overrides]]
path = "MarkdownSource/test/test_upstream.jl"
on_include = "skip"
[[initialization_options.analysis_overrides]]
path = "MarkdownSource/upstream/**/*.jl"
full_analysis = false

[[initialization_options.analysis_overrides]]
path = "TOMLSource/test/test_upstream.jl"
on_include = "skip"
[[initialization_options.analysis_overrides]]
path = "TOMLSource/upstream/**/*.jl"
full_analysis = false

[[initialization_options.analysis_overrides]]
path = "Compiler/snapshots/**/*.jl"
full_analysis = false
[[initialization_options.analysis_overrides]]
path = "Compiler/src/**/*.jl"
full_analysis = false
