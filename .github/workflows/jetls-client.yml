name: jetls-client

on:
  push:
    branches:
      - master
    paths:
      - "jetls-client/**"
      - "src/**"
      - "scripts/schema/**"
      - ".github/workflows/jetls-client.yml"
  pull_request:
    branches-ignore:
      - release
    paths:
      - "jetls-client/**"
      - "src/**"
      - "scripts/schema/**"
      - ".github/workflows/jetls-client.yml"

jobs:
  check:
    name: Check jetls-client (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install dependencies
        working-directory: jetls-client
        run: npm ci
      - name: Run checks
        working-directory: jetls-client
        run: npm run check
      - name: Run tests
        working-directory: jetls-client
        run: npm test
      - name: Build production extension bundle
        working-directory: jetls-client
        run: npm run build

  check_package_json:
    name: Check package.json is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate schema project
        run: julia --startup-file=no --project=scripts/schema -e 'using Pkg; Pkg.instantiate()'
      - name: Check package.json is up to date
        run: |
          julia --startup-file=no --project=scripts/schema scripts/schema/update-pkg-json.jl jetls-client/package.json --check

  check_version_pin:
    name: Check JETLS_VERSION.json matches the pinned release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the julia bounds against the pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-jetls-client-julia-bounds.sh
