name: Test matrix

on:
  workflow_call:
    inputs:
      coverage:
        description: Collect coverage and upload it to Codecov
        type: boolean
        required: false
        default: true
      include-nightly:
        description: Also test against the next Julia release
        type: boolean
        required: false
        default: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't stop CI even when one of them fails
      matrix:
        include:
          - version: "1" # current stable
            os: ubuntu-latest
            arch: x64
          - version: "1.12" # minimum version supported
            os: ubuntu-latest
            arch: x64
          - version: "1" # x86 ubuntu
            os: ubuntu-latest
            arch: x86
          - version: "1" # x86 windows
            os: windows-latest
            arch: x86
          - version: "1" # x64 windows
            os: windows-latest
            arch: x64
          - version: "1" # x64 macOS
            os: macos-latest
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          coverage: ${{ inputs.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: inputs.coverage
      - uses: codecov/codecov-action@v7
        if: inputs.coverage
        with:
          flags: JETLS.jl

  # Kept separate from `test` so that callers gating a release can opt out:
  # failures against an unreleased Julia should not block shipping.
  test_nightly:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    if: inputs.include-nightly
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # don't stop CI even when one of them fails
      matrix:
        include:
          - version: "1.13-nightly" # next release
            os: ubuntu-latest
            arch: x64
          # - version: "nightly" # dev
          #   os: ubuntu-latest
          #   arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # - name: allow JET to be loaded on nightly
      #   if: matrix.version == 'nightly'
      #   run: |
      #     echo '
      #     [JET]
      #     JET_DEV_MODE = true
      #     ' > LocalPreferences.toml
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          coverage: ${{ inputs.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: inputs.coverage
      - uses: codecov/codecov-action@v7
        if: inputs.coverage
        with:
          flags: JETLS.jl
