name: jetls-client release

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - "jetls-client/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release invariants
    if: >-
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.head.ref, 'jetls-client-releases/v')
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the release branch matches package.json and the CHANGELOG
        run: |
          VERSION="${HEAD_REF#jetls-client-releases/v}"
          PACKAGE_VERSION=$(node -p "require('./jetls-client/package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Branch version $VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          grep -Fxq "## v$VERSION" jetls-client/CHANGELOG.md
      - name: Check the pinned JETLS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${HEAD_REF#jetls-client-releases/v}"
          REVISION=$(node -p "require('./jetls-client/JETLS_VERSION.json').revision")
          gh api "repos/${{ github.repository }}/git/ref/tags/$REVISION" --jq .ref
          awk -v ver="## v$VERSION" '
            /^## / { if (found) exit; if ($0 == ver) { found = 1; next } }
            found' jetls-client/CHANGELOG.md |
            grep -Fq -- "- Pinned JETLS: [\`$REVISION\`]"
      - name: Check the release tag does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${HEAD_REF#jetls-client-releases/v}"
          if gh api "repos/${{ github.repository }}/git/ref/tags/jetls-client/v$VERSION" >/dev/null 2>&1; then
            echo "Tag jetls-client/v$VERSION already exists"
            exit 1
          fi

  publish:
    name: Package and publish
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'jetls-client-releases/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        working-directory: jetls-client
        run: npm ci
      # `vsce package` runs the `vscode:prepublish` script, which re-runs the
      # checks, the tests, and the production build against the packaged state.
      - name: Package the extension
        working-directory: jetls-client
        run: npx vsce package
      # The steps below are idempotent so a failed run can be re-run from
      # any point: the Marketplace publish skips an already-published
      # version and the tag push skips an existing tag. There is no
      # GitHub release for the extension: the repository's releases feed
      # is reserved for the JETLS server releases (whose
      # `releases/latest` asset URLs must stay stable), while the
      # Marketplace serves the extension's changelog and older versions;
      # the tag alone records the released commit.
      - name: Publish to the Marketplace
        working-directory: jetls-client
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VERSION="${HEAD_REF#jetls-client-releases/v}"
          npx vsce publish --skip-duplicate --packagePath "jetls-client-$VERSION.vsix"
      - name: Push the release tag
        run: |
          VERSION="${HEAD_REF#jetls-client-releases/v}"
          TAG="jetls-client/v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG" "$MERGE_SHA"
            git push origin "refs/tags/$TAG"
          fi
