name: LSP.jl

on:
  push:
    branches:
      - master
    paths:
      - "LSP/**"
      - "LSP/Project.toml"
      - ".github/workflows/LSP.jl.yml"
  workflow_call:

jobs:
  LSP:
    name: Test LSP.jl
    runs-on: ubuntu-latest
    steps:
      # The root `Project.toml` lists `LSP` as a workspace project, so checking it out would
      # make Pkg resolve LSP.jl together with the entire JETLS workspace. Check out `LSP/`
      # only so that LSP.jl is tested as a standalone package. Non-cone mode is required
      # because cone mode always includes root-level files.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: /LSP/
          sparse-checkout-cone-mode: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1" # most stable version
          arch: x64
      - uses: julia-actions/cache@v3
      - name: test LSP
        shell: julia --color=yes --project=. {0}    # this is necessary for the next command to work on Windows
        run: 'using Pkg; Pkg.activate(normpath(pwd(), "LSP")); Pkg.instantiate(); Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: LSP/src
      - uses: codecov/codecov-action@v7
        with:
          flags: LSP.jl
