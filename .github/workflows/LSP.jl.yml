name: LSP.jl

on:
  push:
    branches:
      - master
    paths:
      - "LSP/**"
      - "LSP/Project.toml"
      - "HierarchicalTestSets/**"
      - ".github/workflows/LSP.jl.yml"
      - "!LSP/README.md"
      - "!HierarchicalTestSets/README.md"
  workflow_call:

jobs:
  verified_tree:
    name: Verified tree
    if: github.event_name == 'push'
    uses: ./.github/workflows/verified-tree.yml

  LSP:
    name: Test LSP.jl
    needs: verified_tree
    # `!failure() && !cancelled()` keeps this job running when `verified_tree` is skipped,
    # i.e. when `ci.yml` calls this workflow for a pull request.
    if: ${{ !failure() && !cancelled() && needs.verified_tree.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # The root `Project.toml` lists `LSP` as a workspace project, so checking it out would
      # make Pkg resolve LSP.jl together with the entire JETLS workspace. Check out `LSP/`
      # (plus `HierarchicalTestSets/`, which its tests use) only so that LSP.jl is tested
      # as a standalone package. Non-cone mode is required because cone mode always
      # includes root-level files.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /LSP/
            /HierarchicalTestSets/
          sparse-checkout-cone-mode: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1" # most stable version
          arch: x64
      - uses: julia-actions/cache@v3
      - name: test LSP
        shell: julia --color=yes --project=. {0}    # this is necessary for the next command to work on Windows
        run: 'using Pkg; Pkg.activate(normpath(pwd(), "LSP")); Pkg.instantiate(); Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: LSP/src
      - uses: codecov/codecov-action@v7
        with:
          flags: LSP.jl
