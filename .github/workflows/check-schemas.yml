name: Check schemas

on:
  workflow_call:

jobs:
  check_schemas:
    name: Check schemas are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate scripts project
        run: julia --startup-file=no --project=scripts -e 'using Pkg; Pkg.instantiate()'
      - name: Check schemas
        run: ./scripts/generate-schemas.sh --check
