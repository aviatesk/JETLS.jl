name: Test jetls app

on:
  workflow_call:
    inputs:
      release-installation:
        description: Test installation of the release app
        type: boolean
        required: false
        default: false

jobs:
  test_release_installation:
    name: Test release installation - Julia ${{ matrix.version }}
    if: inputs.release-installation
    runs-on: ubuntu-latest
    # Failures against nightly Julia should not block a release, but stay visible.
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1"
          - "~1.14.0-0"
          - "nightly"
    env:
      JULIA_DEPOT_PATH: /tmp/jetls-depot
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - name: Install current checkout
        shell: julia --color=yes --startup-file=no {0}
        run: |
          using Pkg
          Pkg.Apps.add(; path=pwd())
          open(ENV["GITHUB_PATH"], "a") do io
              println(io, joinpath(first(DEPOT_PATH), "bin"))
          end
      - name: Test installed configuration
        shell: julia --color=yes --startup-file=no {0}
        run: |
          using Pkg, TOML
          app_project = joinpath(first(DEPOT_PATH), "environments", "apps", "JETLS")
          # Julia 1.12 and 1.13.0 resolve the app environment before installing any registry
          manifest = TOML.parsefile(joinpath(app_project, "Manifest.toml"))
          for (name, entries) in manifest["deps"], entry in entries
              name == "JETLS" && continue
              haskey(entry, "git-tree-sha1") || continue
              @assert get(entry, "repo-url", nothing) == "https://github.com/aviatesk/JETLS.jl" &&
                  startswith(get(entry, "repo-subdir", ""), "vendor/") "$name is not installed from a vendored source"
          end
          Pkg.activate(app_project)
          using JETLSCore
          @assert !JETLSCore.JETLS_DEV_MODE
          @assert !JETLSCore.JETLS_TEST_MODE
          @assert JETLSCore.PrecompileTools.workload_enabled(JETLSCore)
      - name: Test installed executable
        run: |
          julia_version="$(julia --startup-file=no -e 'print(VERSION)')"
          test "$(jetls --version)" = "jetls version $(cat JETLS_VERSION), julia version $julia_version"

  test_app_commands:
    name: Test jetls app commands - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    # Failures against nightly Julia should not block merging or a release, but stay visible.
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1" # most stable version
          - "~1.14.0-0"
          - "nightly"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          coverage: false
