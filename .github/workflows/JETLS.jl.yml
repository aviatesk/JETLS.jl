name: JETLS.jl

on:
  workflow_call:
    inputs:
      include-nightly:
        description: Also test against the next Julia release
        type: boolean
        required: false
        default: true

jobs:
  test:
    uses: ./.github/workflows/test-matrix.yml
    with:
      include-nightly: ${{ inputs.include-nightly }}

  JETLS_DEV_MODE:
    name: Test with `JETLS_DEV_MODE = true`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: enable JETLS_DEV_MODE for tests
        run: |
          echo '
          [JETLS]
          JETLS_DEV_MODE = true
          ' > test/LocalPreferences.toml
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest

  JET_DEV_MODE:
    name: Test with `JET_DEV_MODE = true`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: set LocalPreferences.toml
        working-directory: .
        run: |
          echo '
          [JET]
          JET_DEV_MODE = true
          ' > LocalPreferences.toml
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest

  JETLS_DEBUG_LOWERING:
    name: Test with `JETLS_DEBUG_LOWERING = true`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: set LocalPreferences.toml
        working-directory: .
        run: |
          echo '
          [JETLS]
          JETLS_DEBUG_LOWERING = true
          ' > LocalPreferences.toml
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest

  JULIA_NUM_THREADS:
    name: Test with `JULIA_NUM_THREADS = 4,2`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        env:
          JULIA_NUM_THREADS: "4,2"

  test_app:
    uses: ./.github/workflows/test-app.yml

  compiler-snapshots:
    name: Check Compiler snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: x64
      - run: julia --startup-file=no Compiler/update-snapshots.jl --check
