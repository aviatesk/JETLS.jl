name: Check sources

on:
  workflow_call:

jobs:
  check_sources:
    name: Check `[sources]` across the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
          arch: x64
      - run: julia --startup-file=no scripts/check-sources.jl
